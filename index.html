<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1f3a" />

    <style>
      /* Loading screen: shows instantly while the app starts, then React replaces it. */
      body { margin: 0; background: #0b1f3a; }
      .boot { min-height: 100vh; display: grid; place-items: center; color: #fff;
              font-family: system-ui, 'Segoe UI', Roboto, sans-serif; text-align: center; }
      .boot h1 { margin: 0 0 6px; font-size: 1.8rem; }
      .boot h1 span { color: #2fb67c; }
      .boot p { margin: 0; color: #b8c4d9; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot"><div><h1>Trade<span>Mate</span> SA</h1><p>Loading…</p></div></div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
